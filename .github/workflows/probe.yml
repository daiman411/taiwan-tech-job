name: probe
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in https://apiservice.mol.gov.tw/OdService/download/A17000000J-030144-MKw https://apiservice.mol.gov.tw/OdService/download/A17000000J-030144-nkP \
                   https://data.taipei/api/dataset/9cb8ebf1-8d21-4523-908c-af853867eea1/resource/cec51213-9585-4b4a-ae18-5c9309ddf453/download \
                   https://data.taipei/api/dataset/9cb8ebf1-8d21-4523-908c-af853867eea1/resource/b0c24ef5-06dd-4027-9a1a-5c39c3381cbe/download; do
            echo "=================== $u"
            curl -sSL -m 120 -D h.txt -o f.bin "$u"; grep -iE '^(HTTP|content-type|content-disposition|last-modified)' h.txt
            ls -la f.bin; file f.bin
            python3 - <<'PY'
          import json, io, csv
          raw = open('f.bin','rb').read()
          for enc in ('utf-8-sig','big5','cp950'):
              try: txt = raw.decode(enc); break
              except Exception: pass
          print('enc', enc, 'chars', len(txt))
          try:
              d = json.loads(txt)
              rows = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), [d])
              print('json rows', len(rows)); print(json.dumps(rows[:2], ensure_ascii=False)[:2500])
              keys = rows[0].keys() if rows and isinstance(rows[0], dict) else []
              print('keys', list(keys))
          except Exception as e:
              r = list(csv.reader(io.StringIO(txt)))
              print('csv rows', len(r)); print(r[:3])
              # count tech rows
              import re
              tech = [x for x in r[1:] if re.search(r'工程師|軟體|程式|資訊|韌體|資料|數據|網路|系統', ' '.join(x))]
              print('tech-ish rows', len(tech)); print(tech[:3])
          PY
          done
