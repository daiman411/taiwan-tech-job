name: probe
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for body in '{"q":"職缺"}' '{"query":"職缺"}' '{"keyword":"職缺"}' '{"bool":[{"fulltext":{"value":"職缺"}}],"page_num":1,"page_limit":10}'; do
            echo "== POST $body"; curl -sS -m 30 -X POST -H 'Content-Type: application/json' -d "$body" "https://data.gov.tw/api/front/dataset/list" | head -c 2500; echo
          done
          echo "== taiwanjobs"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "https://www.taiwanjobs.gov.tw/"
          curl -sS -m 30 "https://www.taiwanjobs.gov.tw/Internet/Index/openData.aspx" | grep -oiE 'href="[^"]*(json|csv|xml|opendata|OpenData)[^"]*"' | head -40
          echo "== 1111 / 518 status"
          for u in https://www.1111.com.tw/search/job?ks=python https://www.518.com.tw/job-index.html https://www.104.com.tw/jobs/search/ ; do curl -sS -m 30 -o /dev/null -w "%{http_code} $u\n" -A "Mozilla/5.0" "$u"; done
