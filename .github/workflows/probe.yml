name: probe
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in 職缺 台灣就業通 求才 徵才; do
            echo "===== $q"
            curl -sS -m 60 -X POST -H 'Content-Type: application/json' -d "{\"bool\":[{\"fulltext\":{\"value\":\"$q\"}}],\"page_num\":1,\"page_limit\":80}" https://data.gov.tw/api/front/dataset/list > r.json
            python3 -c "
          import json
          for d in json.load(open('r.json'))['payload']['search_result']:
              print(d['nid'], '|', d['agency_name'], '|', d['title'], '|', d.get('updatefreq_desc'), '|', d.get('all_file_format_name'), '|', (d.get('all_url') or [''])[:2])
          "
          done
