name: probe
on:
  push:
    branches: [probe-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="TaiwanTechJobBot/1.0 (+https://github.com/daiman411/taiwan-tech-job)"
          curl -sS -m 30 -A "$UA" https://www.518.com.tw/robots.txt | head -40
          echo ======
          for u in "https://www.518.com.tw/job-index.html" "https://www.518.com.tw/job-index.html?ab=2032001" "https://www.518.com.tw/job-index-P-1.html?ab=2032001" "https://www.518.com.tw/job-index.html?i=1&am=1&ab=2032001,2032002"; do
            echo "== $u"; curl -sS -m 30 -A "$UA" -o p.html -w "%{http_code} %{size_download}\n" "$u"
            grep -oE 'href="[^"]*job-[A-Za-z0-9_]+\.html[^"]*"' p.html | sort -u | head -8
            grep -oE '<title>[^<]*' p.html
          done
          echo ====== job page
          J=$(grep -oE 'https://www\.518\.com\.tw/job-[A-Za-z0-9]+\.html' p.html | head -1); echo "$J"
          curl -sS -m 30 -A "$UA" -o j.html -w "%{http_code}\n" "$J"
          python3 - <<'PY'
          import re, html
          t = open('j.html', encoding='utf-8', errors='replace').read()
          for b in re.findall(r'<script[^>]+ld\+json[^>]*>(.*?)</script>', t, re.S): print('LDJSON', b[:1500])
          print(re.findall(r'<title>[^<]*', t))
          PY
          echo ====== search params from form
          grep -oE 'name="[a-z]{1,4}"' p.html | sort | uniq -c | head -30
          grep -oE 'ab=[0-9,]+' p.html | sort | uniq -c | sort -rn | head -20
